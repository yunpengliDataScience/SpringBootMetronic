<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Select the block having id as 'mainContent' here in this page and pass it as a parameter to the fragement named 'pageTemplate'
		 defined in pageTemplate.html under fragments folder. The content should show up as the main content. 
		 Since all styles, navigation, and page layout have been defined in the pageTemplate fragment, we only need to 
		 focus on the main content construction. In addtion, page specific css links and scripts can be added. 
	-->
<th:block
	th:replace="fragments/pageTemplate :: pageTemplate(title='Input Drop-down Comb Page', pageId='inputDropDownCombPage', pageSpecificCSSLinks=~{:: link}, pageSpecificScripts=~{::script}, content=~{:: #mainContent})">

	<link rel="stylesheet" type="text/css" th:href="@{/css/inputDropDownComb.css}" />

	<th:block id="mainContent">
		<div class="container mt-5">
			<h2>Input And Dropdown Comb (Simulates Datalist)</h2>

			<!-- Display success message if present -->
		    <div th:if="${successMessage}" class="alert alert-solid-success alert-bold" role="alert">
		        <div th:text="${successMessage}" class="alert-text"></div>
		        <div class="alert-close">
					<button type="button" class="close" data-dismiss="alert" aria-label="Close">
						<span aria-hidden="true"><i class="la la-close"></i></span>
					</button>
				</div>
		    </div>
							    
			<form th:action="@{/forms/submitInputDropDownCombForm}" th:object="${userAndFruit}" method="post">
				<div id="custom-field-container1" class="custom-input-group">
					<!-- This is where the plugin will create the combined input and dropdown -->
					
					<!-- The purpose of the hidden input is to:
					 1. Preserve user selected/entered input data if backend validation fails. 
					 2. Initialize the visible form field by existing data. 
					 -->
					<input id='hiddenUser' type="hidden" th:field="*{user}">
				</div>
				
				<!-- Display validation error for userName -->
		        <div th:if="${#fields.hasErrors('user')}" class="text-danger">
		            <p th:errors="*{user}">User error</p>
		        </div>
	
				<div id="custom-field-container2" class="custom-input-group">
					<!-- This is where the plugin will create the combined input and dropdown -->
					
					<!-- The purpose of the hidden input is to:
					 1. Preserve user selected/entered input data if backend validation fails. 
					 2. Initialize the visible form field by existing data. 
					 -->
					<input id='hiddenFruit' type="hidden" th:field="*{fruit}">
				</div>
				<!-- Display validation error for fruit -->
		        <div th:if="${#fields.hasErrors('fruit')}" class="text-danger">
		            <p th:errors="*{fruit}">Fruit selection error</p>
		        </div>
				
				<br>
				<!-- Submit button -->
        		<button type="submit" class="btn btn-primary">Submit</button>
			</form>
		</div>
	</th:block>

	<script>
		
		//------------------------------------------------------------------------------------------------------------------------------------
		//Jquery Plugin (customDatalist) Definition
		//
		//1. Use $.extend({...}, options) to merge Json objects into settings. The options can be user defined.
		//2. Use $(...) to create HTML components, such as label, inputGroup, dropdownButton (arrow icon), textInput, and dropdownMenu, and 
		//	 then assemble them together under the container.
		//3. Craft the behavior of textInput: Whenever textInput is clicked, show all items in drop-down menu.
		//4. Craft the behavior of dropdownMenu: Whenever an menu item is clicked, default link behavior is ignored, value of the menu item is
		//										 transfered to the textInput, and then hide the entire drop-down menu.
		//5. Craft the behavior of dropdownMenu: Whenever clicking occurs outside the drop-down menu, just hide the entire drop-down menu.
		//6. Upon form submission, copy the input text value to the hidden field and submit the hidden field to prevent duplicated values submitted.
		//------------------------------------------------------------------------------------------------------------------------------------
		(function ($) {
			$.fn.customDatalist = function (options) {
				
				// Default settings. The options are merged into settings by $.extend()
				var settings = $.extend({
					containerId: '',
					label: 'Label',
					textPlaceholder: 'Enter or select',
					dropdownOptions: ['Option 1', 'Option 2', 'Option 3'],
					onValueChange: function (data) {
						console.log(data);
					}
				}, options);

				//-------------------------------------------------------------------------------------------------
				//Construct the components
				//-------------------------------------------------------------------------------------------------
				
				// Create the label. Note: $(...) is not only used to select DOM elements but also to create DOM elements.
				var label = $('<label for="' + settings.inputId + '" class="col-form-label">' + settings.label +'</label>');
				
				// Create the input group
				var inputGroup = $('<div class="input-group"></div>');
				
				// Create the dropdown arrow button
				var dropdownButton = $('<div class="input-group-append"><span class="dropdown-arrow">&#9660;</span></div>');
				
				// Get the input value from the nested hidden field.  Such input value will be used as the default value in the input field.
				var inputValue = $(settings.containerId).find('input[type="hidden"]').val().trim();
				
				// Debug
				console.log('inputValue=' + inputValue+'|');
				
				// Create the input field. Note: $(...) is not only used to select DOM elements but also to create DOM elements.
				var textInput = $('<input type="text" class="form-control custom-input" placeholder="' + settings.textPlaceholder + '" autocomplete="off" id="' + settings.inputId + '" name="' + settings.inputName + '" value="' + inputValue +'">');

				// Create the dropdown arrow (caret)
				//var dropdownArrow = $('<span class="dropdown-arrow">&#9660;</span>'); // Unicode for down arrow (▼)
				
				// Create the dropdown menu that will show the options. Note: $(...) is not only used to select DOM elements but also to create DOM elements.
				var dropdownMenu = $('<div class="dropdown-menu w-100" id=' + settings.dropDownId + '></div>');

				// Append dropdown options to the dropdownMenu
				settings.dropdownOptions.forEach(function (option) {
					dropdownMenu.append('<a class="dropdown-item" href="#">' + option + '</a>');
				});

				// Append label, input, dropdown arrow, and dropdown menu to the container
				inputGroup.append(textInput).append(dropdownButton);
				this.append(label).append(inputGroup).append(dropdownMenu);
				
				
				//-------------------------------------------------------------------------------------------------
				//Craft the behaviors of components
				//-------------------------------------------------------------------------------------------------
				
				// Show all options whenever the input is clicked
				textInput.on('click', function () {
					dropdownMenu.children('a').show();  // Ensure all options are visible
					dropdownMenu.addClass('show');      // Show the dropdown
				});

				// Handle selecting an option from the dropdown
				dropdownMenu.on('click', 'a', function (e) {
					e.preventDefault(); // Ignore default link clicking behavior
					
					// Get the selected option text
					var selectedOption = $(this).text();
					
					textInput.val(selectedOption);  // Copy the value of the seletion to input box
					dropdownMenu.removeClass('show');  // Hide the dropdown after selection

					// Call the onValueChange callback with the selected option
					settings.onValueChange({
						text: selectedOption  // object with Key: text, Value: selectedOption
					});
					
				});

				// Hide dropdown if clicked outside
				$(document).on('click', function (e) {
					//used to determine whether the element that triggered the event (e.target) is inside the #custom-field-container element or not. 
					//If it's not inside, the dropdown menu will be hidden.
					if (!$(e.target).closest(settings.containerId).length) {
						dropdownMenu.removeClass('show');
					}
				});
				
				// Upon form submission, copy the input text value to the hidden field and submit the hidden field to prevent duplicated values submitted.
				// The purpose of the hidden input is to 1. Preserve user selected/entered input data if backend validation fails. 2. Initialize the visible form field by existing data.
				$('form').on('submit', function () {
					var visibleValue = textInput.val();
					
					// Debug
					console.log('visibleValue=' + visibleValue);
					
					//alert('input[name="' + settings.inputName + '"]' + visibleValue);
					
					//Copy input text value to hidden field and only submit the hidden field to prevent duplicated values submitted; otherwise, a concat string with seperated by commas will appear in the submitted value.
					$('input[type="hidden"][name="' + settings.inputName + '"]').val(visibleValue);
					$('input[name="' + settings.inputName + '"]:not([type="hidden"])').remove();
				});

				// Maintain chainability
				return this;
			};
		}(jQuery));

		//-----------------------------------------------------------------------------------------------------------------------
		//Usage: Attach Jquery plug-in to the component place holder
		//-----------------------------------------------------------------------------------------------------------------------
		$(document).ready(function () {

			$('#custom-field-container1').customDatalist({
				containerId: '#custom-field-container1',
				label: 'User:',
				inputId: 'inputDropDownCombo1',
				inputName: 'user',
				dropDownId: 'dropDownData1',
				textPlaceholder: 'Enter text or select an option',
				dropdownOptions: ['', 'Admin', 'User', 'Guest', 'Developer', 'Manager'],  //TODO: May use Ajax to prepopulate it.
				onValueChange: function (data) {
					console.log('Selected value:', data.text);
				}
			});

			$('#custom-field-container2').customDatalist({
				containerId: '#custom-field-container2',
				label: 'Fruit:',
				inputId: 'inputDropDownCombo2',
				inputName: 'fruit',
				dropDownId: 'dropDownData2',
				textPlaceholder: 'Enter text or select an option',
				dropdownOptions: ['', 'Apple', 'Pear', 'Grape', 'Cherry', 'banana'],  //TODO: May use Ajax to prepopulate it.
				onValueChange: function (data) {
					console.log('Selected value:', data.text);
				}
			});

		});
		
	</script>
</th:block>

</html>
