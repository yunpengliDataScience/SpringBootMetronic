<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
	<!-- Select the block having id as 'mainContent' here in this page and pass it as a parameter to the fragement named 'pageTemplate'
		 defined in pageTemplate.html under fragments folder. The content should show up as the main content. 
		 Since all styles, navigation, and page layout have been defined in the pageTemplate fragment, we only need to 
		 focus on the main content construction. In addtion, page specific css links and scripts can be added. 
	-->
	<th:block th:replace="fragments/pageTemplate :: pageTemplate(title='Sample jsTree Page', pageId='jsTreePage', pageSpecificCSSLinks=~{:: link}, pageSpecificScripts=~{::script}, content=~{:: #mainContent})">
		
		<link rel="stylesheet" type="text/css" th:href="@{/css/sampleStyle.css}" />
		
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jstree@3.3.12/dist/themes/default/style.min.css" />
		
		<th:block id="mainContent">
			<div>jsTree Demo</div>
			<br/>
			
			<div id="jstree"></div>

			<div id="editModal" style="display:none;">
				<label>Node Name: <input type="text" id="nodeName" /></label><br/>
			    <label>Custom Field: <input type="text" id="nodeCustom" /></label><br/>
			    <button onclick="saveNode()" class="btn btn-primary">Save</button>
			</div>
			
			<br/>
			<br/>
			<br/>
			<button onclick="addNode()" class="btn btn-primary">Add Child Node</button>
			<button onclick="saveTree()" class="btn btn-primary">Save Tree to DB</button>
			
		</th:block>
		
		<script>
			let selectedNode = null;

			$(function () {
			  $('#jstree').jstree({
			    'core': {
			      'check_callback': true,
			      'data': [
			        { "id": "1", "parent": "#", "text": "Root", "data": { "custom": "meta1" } }
			      ]
			    }
			  });
			
			  $('#jstree').on("select_node.jstree", function (e, data) {
			    selectedNode = data.node;
			    $('#nodeName').val(data.node.text);
			    $('#nodeCustom').val(data.node.data?.custom || '');
			    $('#editModal').show();
			  });
			});
			
			function saveNode() {
			  const tree = $('#jstree').jstree(true);
			  const newText = $('#nodeName').val();
			  const newCustom = $('#nodeCustom').val();
			
			  if (selectedNode) {
			    tree.rename_node(selectedNode, newText);
			    selectedNode.data = selectedNode.data || {};
			    selectedNode.data.custom = newCustom;
			  }
			
			  $('#editModal').hide();
			}
			
			function addNode() {
			  const tree = $('#jstree').jstree(true);
			  if (!selectedNode) {
			    alert("Select a node to add a child to.");
			    return;
			  }
			
			  const newNodeId = Date.now().toString(); // unique ID
			  const newNode = tree.create_node(selectedNode, {
			    id: newNodeId,
			    text: "New Node",
			    data: { custom: "" }
			  });
			
			  if (newNode) {
			    tree.edit(newNode); // allow inline renaming
			  }
			}
			
			function saveTree() {
			  const treeData = $('#jstree').jstree(true).get_json('#', { flat: false });
			
			  alert(JSON.stringify(treeData));
			  
			  $.ajax({
			    url: '/saveTree',
			    type: 'POST',
			    contentType: 'application/json',
			    data: JSON.stringify(treeData),
			    success: () => alert("Tree saved successfully!"),
			    error: () => alert("Error saving tree.")
			  });
			}
		</script>
		
		<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  		<script src="https://cdn.jsdelivr.net/npm/jstree@3.3.12/dist/jstree.min.js"></script>
  		
  		
	</th:block>
</html>
